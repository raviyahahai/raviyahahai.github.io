name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "raviyahahai-site.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare portfolio files
        run: |
          test -f raviyahahai-site.zip || { echo "Upload raviyahahai-site.zip to the repository root first."; exit 1; }
          mkdir -p dist extracted
          unzip -q raviyahahai-site.zip -d extracted
          test -d extracted/raviyahahai-site || { echo "ZIP does not contain the expected raviyahahai-site/ folder."; exit 1; }
          cp -a extracted/raviyahahai-site/. dist/
          test -f dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
